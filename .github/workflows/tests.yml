name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch keeps the download small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[all]"
      - name: Lint
        run: ruff check .
      - name: Build the sensor database
        run: python data/generate_db.py --out data/sensors.db
      - name: Unit tests (no API calls; Docker sandbox tests skip without the image)
        run: pytest -q
