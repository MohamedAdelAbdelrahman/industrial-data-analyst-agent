[project]
name = "industrial-data-analyst"
version = "0.1.0"
description = "LangGraph planner/executor agent with MCP tools for industrial sensor data"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "sqlglot",
    "mcp[cli]",
    "langgraph",
    "langchain-core",
    "langchain-mcp-adapters",
    "langchain-google-genai",
    "python-dotenv",
]

[project.optional-dependencies]
rag = ["pymupdf", "chromadb", "sentence-transformers"]
sandbox = ["docker"]
obs = ["langfuse"]
ui = ["streamlit"]
anthropic = ["langchain-anthropic"]
dev = ["pytest", "ruff"]
all = ["industrial-data-analyst[rag,sandbox,obs,ui,dev]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real LLM API (run with --live)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = [
    "C408",    # dict(...) with keyword args is fine
    "ISC004",  # implicit concatenation is how long strings are wrapped here
]
