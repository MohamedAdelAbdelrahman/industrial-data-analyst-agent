# Agent eval tasks (Step 10). `python eval/run_eval.py --config llm|finetuned` runs them.
#
# A task passes when every check it lists passes:
#   expect_sql  reference SQL, run at eval time: every cell of its result must appear in the answer
#               (text: case-insensitive; numbers: within `tol`, relative, default 1%). Keep results small.
#   mention     strings the answer must contain (case-insensitive); a list inside means "any of these"
#   numbers     numbers the answer must contain, within `tol`
#   manual      a search_manuals hit with this machine_type and a section starting with `section`
#   chart       run_python produced at least one image
#   refuse      true: the run must be refused (by input_guard or the planner); otherwise it must not be
# Numbers in `numbers` that cannot come from SQL (percentiles, charts) were computed once with pandas on
# the generated database (fixed seed); `note` says how.

# ---------- sql_only: one or two queries ----------
- id: sql_active_alarms
  category: sql_only
  question: How many alarms are still active right now, and on which machines?
  expect_sql: SELECT m.name FROM alarms a JOIN machines m ON m.machine_id = a.machine_id WHERE a.cleared_at IS NULL
  numbers: [5]

- id: sql_compressor_process_alarms
  category: sql_only
  question: Which compressor had the most process alarms (HIGH or HIGH_HIGH), and how many?
  mention: [Compressor-03]
  numbers: [7]

- id: sql_top3_critical_tie
  category: sql_only
  note: 5 machines tie at 3 critical alarms; LIMIT 3 silently drops 2 (eval/candidate_tasks.md, Step 3)
  question: Which 3 machines had the most critical alarms, and how many each?
  expect_sql: |
    WITH t AS (SELECT m.name, COUNT(*) AS n FROM alarms a JOIN machines m ON m.machine_id = a.machine_id
               WHERE a.severity = 'critical' GROUP BY m.name)
    SELECT name, n FROM t WHERE n >= (SELECT n FROM t ORDER BY n DESC LIMIT 1 OFFSET 2)

- id: sql_cost_per_plant
  category: sql_only
  question: What was the total maintenance cost per plant?
  expect_sql: |
    SELECT m.plant, ROUND(SUM(e.cost_eur), 2) FROM maintenance_events e
    JOIN machines m ON m.machine_id = e.machine_id GROUP BY m.plant

- id: sql_most_expensive_machine
  category: sql_only
  question: Which machine had the highest total maintenance cost, and how much was it?
  expect_sql: |
    SELECT m.name, ROUND(SUM(e.cost_eur), 2) AS c FROM maintenance_events e
    JOIN machines m ON m.machine_id = e.machine_id GROUP BY m.name ORDER BY c DESC LIMIT 1

- id: sql_unacknowledged
  category: sql_only
  question: How many alarms were never acknowledged, and how many of those are critical?
  expect_sql: |
    SELECT COUNT(*), SUM(severity = 'critical') FROM alarms WHERE acknowledged_by IS NULL

- id: sql_bad_quality_share
  category: sql_only
  question: How many sensor readings have bad quality, and what percentage of all readings is that?
  numbers: [2226, 0.4]
  tol: 0.02

- id: sql_in_maintenance
  category: sql_only
  question: Which machines currently have the status maintenance?
  expect_sql: SELECT name FROM machines WHERE status = 'maintenance'

- id: sql_avg_vibration_null_trap
  category: sql_only
  note: bad readings have value NULL; "last 7 days" ends at the data end 2026-10-01
  question: What was the average vibration of Pump-03 over the last 7 days?
  expect_sql: |
    SELECT AVG(r.value) FROM readings r JOIN sensors s ON s.sensor_id = r.sensor_id
    JOIN machines m ON m.machine_id = s.machine_id
    WHERE m.name = 'Pump-03' AND s.sensor_type = 'vibration' AND r.ts >= '2026-09-24 00:00:00'

- id: sql_alarm_driven_maintenance
  category: sql_only
  question: How many maintenance events were triggered by an alarm, and what did they cost in total?
  expect_sql: |
    SELECT COUNT(*), ROUND(SUM(cost_eur), 2) FROM maintenance_events WHERE related_alarm_id IS NOT NULL

- id: sql_alarms_per_day_avg
  category: sql_only
  note: 155 alarms over 60 days = 2.58; averaging only the 53 days with alarms gives 2.92 (wrong)
  question: On average, how many alarms were raised per day over the whole period?
  numbers: [2.58]

- id: sql_longest_alarm
  category: sql_only
  question: Which alarm lasted longest from trigger to clear? Give the machine, sensor and duration.
  mention: [CNC-Mill-01, current]
  numbers: [[9.75, 585]]      # hours or minutes

- id: sql_zero_active_compressor01
  category: sql_only
  note: the true answer is 0, which the training data barely covers (docs/design.md, Step 6b)
  question: How many active alarms does Compressor-01 have right now?
  mention: [['re:(?<![\d.,-])0(?![\d.,])', "no active", "none", "zero", "not have any", "no alarms", "no currently active"]]

