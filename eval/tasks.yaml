# ---------- sql+manual ----------
- id: mix_critical_vibration_tie
  category: sql+manual
  note: 8 machines tie at 1 critical vibration alarm; LIMIT 1 picks one at random (demo Q4)
  question: Which machine had the most critical vibration alarms, and what does its manual recommend for high vibration?
  expect_sql: |
    WITH t AS (SELECT m.name, COUNT(*) AS n FROM alarms a JOIN machines m ON m.machine_id = a.machine_id
               JOIN sensors s ON s.sensor_id = a.sensor_id
               WHERE s.sensor_type = 'vibration' AND a.severity = 'critical' GROUP BY m.name)
    SELECT name FROM t WHERE n = (SELECT MAX(n) FROM t)
  manual: {section: "4."}

- id: mix_pump_most_alarms
  category: sql+manual
  note: alarms should be broken down by sensor (flow has the critical ones), not by alarm type
  question: Which pump had the most alarms, and what does its manual recommend?
  mention: [Pump-03]
  numbers: [12]
  manual: {machine_type: Pump, section: "4."}

